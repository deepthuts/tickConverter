<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tick Converter</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f27; --muted: #6b7280;
    --line: #e3e6eb; --accent: #2563eb; --ok: #15803d; --bad: #b91c1c;
    --okbg: #e8f6ec; --badbg: #fdeaea; --logbg: #0f172a; --logtext: #cbd5e1;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1116; --card: #161b22; --text: #e6e9ee; --muted: #8b95a5;
      --line: #263041; --accent: #4f8cff; --ok: #4ade80; --bad: #f87171;
      --okbg: #12261a; --badbg: #2a1414; --logbg: #090c12; --logtext: #b6c2d4;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 28px 16px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 22px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 18px; margin-bottom: 18px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], select { width: 100%; padding: 9px 10px; border: 1px solid var(--line);
    border-radius: 8px; background: var(--bg); color: var(--text); font: inherit; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .drop { border: 2px dashed var(--line); border-radius: 10px; padding: 22px; text-align: center;
    color: var(--muted); cursor: pointer; margin-bottom: 12px; }
  .drop.over { border-color: var(--accent); color: var(--accent); }
  .drop strong { color: var(--text); }
  .or { text-align: center; color: var(--muted); font-size: 13px; margin: 2px 0 10px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid transparent; }
  .primary { background: var(--accent); color: #fff; padding: 10px 18px; font-weight: 600; }
  .primary:disabled { opacity: .5; cursor: not-allowed; }
  .ghost { background: transparent; border-color: var(--line); color: var(--muted); padding: 4px 10px; font-size: 13px; }
  .ghost:hover { color: var(--bad); border-color: var(--bad); }
  .bar { height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; margin: 10px 0; display: none; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
  .bar.busy > div { width: 40%; animation: slide 1.1s infinite ease-in-out; }
  @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  #status { display: none; padding: 10px 12px; border-radius: 8px; font-weight: 600; margin-bottom: 10px; }
  #status.running { display: block; background: var(--bg); border: 1px solid var(--line); }
  #status.done { display: block; background: var(--okbg); color: var(--ok); }
  #status.failed { display: block; background: var(--badbg); color: var(--bad); }
  #log { background: var(--logbg); color: var(--logtext); font: 12.5px/1.6 ui-monospace, Consolas, monospace;
    border-radius: 8px; padding: 10px 12px; height: 210px; overflow: auto; white-space: pre-wrap; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 12px; }
  .stat { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .stat b { display: block; font-size: 17px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .pill { padding: 2px 8px; border-radius: 99px; font-size: 12px; font-weight: 600; }
  .pill.done { background: var(--okbg); color: var(--ok); }
  .pill.failed { background: var(--badbg); color: var(--bad); }
  .empty { color: var(--muted); padding: 8px 0; }
  .err { color: var(--bad); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Tick Converter</h1>
  <p class="sub">Turn a tick CSV into 30 second candles and send them to R2.</p>

  <div class="card">
    <h2>New conversion</h2>
    <div class="row">
      <div>
        <label for="symbol">Symbol</label>
        <input type="text" id="symbol" value="EURUSD">
      </div>
      <div>
        <label for="mode">If a day is already in R2</label>
        <select id="mode">
          <option value="overwrite">Overwrite it</option>
          <option value="skip">Skip it</option>
        </select>
      </div>
    </div>

    <div class="drop" id="drop">
      <div id="dropText"><strong>Drop a tick CSV here</strong> or click to choose one</div>
      <input type="file" id="file" accept=".csv" hidden>
    </div>
    <div class="or">or</div>
    <div style="margin-bottom:14px">
      <label for="path">Paste the file path on this PC (best for very large files)</label>
      <input type="text" id="path" placeholder="C:\ticks\EURUSD_2025.csv">
    </div>

    <button class="primary" id="go">Start</button>
    <div class="bar" id="bar"><div></div></div>
    <div class="err" id="formError"></div>
  </div>

  <div class="card" id="progressCard" style="display:none">
    <h2>Progress</h2>
    <div id="status"></div>
    <div id="log"></div>
    <div class="stats" id="stats"></div>
  </div>

  <div class="card">
    <h2>History</h2>
    <div class="tablewrap" id="history"><div class="empty">Loading...</div></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let chosenFile = null;
let running = false;

// ---------- file picking ----------
const drop = $('drop'), fileInput = $('file');
drop.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', () => setFile(fileInput.files[0]));
['dragenter', 'dragover'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add('over'); }));
['dragleave', 'drop'].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove('over'); }));
drop.addEventListener('drop', ev => setFile(ev.dataTransfer.files[0]));

function setFile(f) {
  chosenFile = f || null;
  $('dropText').innerHTML = f
    ? `<strong>${esc(f.name)}</strong> (${fmtSize(f.size)})`
    : '<strong>Drop a tick CSV here</strong> or click to choose one';
}

// ---------- start a run ----------
$('go').addEventListener('click', () => {
  if (running) return;
  $('formError').textContent = '';
  const pathVal = $('path').value.trim();
  if (!chosenFile && !pathVal) { $('formError').textContent = 'Choose a file or paste a file path.'; return; }

  const form = new FormData();
  form.append('symbol', $('symbol').value);
  form.append('mode', $('mode').value);
  if (chosenFile) form.append('file', chosenFile); else form.append('path', pathVal);

  setRunning(true);
  $('progressCard').style.display = 'block';
  $('log').textContent = '';
  $('stats').innerHTML = '';
  setStatus('running', chosenFile ? 'Uploading file...' : 'Starting...');

  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/run');
  const bar = $('bar'); bar.style.display = 'block'; bar.classList.remove('busy'); bar.firstElementChild.style.width = '0';
  xhr.upload.onprogress = e => {
    if (e.lengthComputable) bar.firstElementChild.style.width = (e.loaded / e.total * 100) + '%';
  };
  xhr.upload.onload = () => { bar.firstElementChild.style.width = ''; bar.classList.add('busy'); };
  xhr.onload = () => {
    let data = {};
    try { data = JSON.parse(xhr.responseText); } catch (e) {}
    if (xhr.status !== 200) { fail(data.error || 'The server refused the file.'); return; }
    setStatus('running', 'Working...');
    poll(data.id, 0);
  };
  xhr.onerror = () => fail('Could not reach the server. Is app.py running?');
  xhr.send(form);
});

function fail(msg) {
  setRunning(false);
  $('bar').style.display = 'none';
  $('formError').textContent = msg;
  setStatus('failed', msg);
}

// ---------- live progress ----------
async function poll(id, since) {
  try {
    const r = await fetch(`/api/jobs/${id}?since=${since}`);
    const j = await r.json();
    j.log.forEach(l => addLog(l));
    if (j.status === 'done') { finish(j.result); return; }
    if (j.status === 'failed') {
      setRunning(false); $('bar').style.display = 'none';
      setStatus('failed', 'Failed: ' + j.error);
      loadHistory(); return;
    }
    setTimeout(() => poll(id, j.next), 1000);
  } catch (e) {
    setTimeout(() => poll(id, since), 2000);   // try again if the server blinked
  }
}

function addLog(l) {
  const box = $('log');
  const t = new Date(l.time).toLocaleTimeString();
  box.textContent += `[${t}] ${l.message}\n`;
  box.scrollTop = box.scrollHeight;
}

function finish(r) {
  setRunning(false);
  $('bar').style.display = 'none';
  setStatus('done', `Done. ${r.days_uploaded} day(s) sent to R2 in ${r.seconds}s.`);
  const stats = [
    ['Ticks read', r.ticks.toLocaleString()],
    ['Candles made', r.candles.toLocaleString()],
    ['Days uploaded', r.days_uploaded],
    ['Days skipped', r.days_skipped],
    ['First day', r.first_day || '-'],
    ['Last day', r.last_day || '-'],
  ];
  $('stats').innerHTML = stats.map(s => `<div class="stat"><b>${s[1]}</b><span>${s[0]}</span></div>`).join('');
  loadHistory();
}

function setStatus(kind, text) { const s = $('status'); s.className = kind; s.textContent = text; }
function setRunning(v) { running = v; $('go').disabled = v; $('go').textContent = v ? 'Running...' : 'Start'; }

// ---------- history ----------
async function loadHistory() {
  const box = $('history');
  try {
    const items = await (await fetch('/api/history')).json();
    if (!items.length) { box.innerHTML = '<div class="empty">No conversions yet.</div>'; return; }
    box.innerHTML = '<table><thead><tr><th>Finished</th><th>File</th><th>Symbol</th><th>Status</th>' +
      '<th>Days</th><th>Candles</th><th>Range</th><th></th></tr></thead><tbody>' +
      items.map(h => `<tr>
        <td>${h.finished_at ? new Date(h.finished_at).toLocaleString() : ''}</td>
        <td title="${esc(h.error || '')}">${esc(h.file)}</td>
        <td>${esc(h.symbol)}</td>
        <td><span class="pill ${h.status}">${h.status}</span></td>
        <td>${h.status === 'done' ? h.days_uploaded + (h.days_skipped ? ` (+${h.days_skipped} skipped)` : '') : '-'}</td>
        <td>${h.status === 'done' ? h.candles.toLocaleString() : '-'}</td>
        <td>${h.first_day ? esc(h.first_day) + ' to ' + esc(h.last_day) : '-'}</td>
        <td><button class="ghost" onclick="removeItem('${h.id}')">Remove</button></td></tr>`).join('') +
      '</tbody></table>';
  } catch (e) { box.innerHTML = '<div class="empty">Could not load history.</div>'; }
}

async function removeItem(id) {
  if (!confirm('Remove this entry from the history list? Your R2 files stay as they are.')) return;
  await fetch('/api/history/' + id, { method: 'DELETE' });
  loadHistory();
}

// ---------- helpers ----------
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtSize(b) { const u = ['B','KB','MB','GB']; let i = 0; while (b >= 1024 && i < 3) { b /= 1024; i++; } return b.toFixed(i ? 1 : 0) + ' ' + u[i]; }

loadHistory();
</script>
</body>
</html>
